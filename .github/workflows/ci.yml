name: CI Pipeline

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kode
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Jalankan unit test
      run: npm test
      
    - name: Tampilkan pesan sukses
      run: echo "✅ Pipeline CI berhasil dijalankan untuk branch ${{ github.ref_name }}"