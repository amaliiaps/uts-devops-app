apiVersion: apps/v1
kind: Deployment
metadata:
  name: uts-devops-deployment
  namespace: default
  labels:
    app: uts-devops
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uts-devops
  template:
    metadata:
      labels:
        app: uts-devops
    spec:
      containers:
      - name: uts-devops-app
        image: uts-devops-app:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"